name: immich

services:
  immich-server:
    # Photo and video backup and management server
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - ${THUMBS_LOCATION}:/data/thumbs
      - ${PROFILE_LOCATION}:/data/profile
      - ${VIDEO_LOCATION}:/data/encoded-video
      - ${BACKUP_LOCATION}:/data/backups
      - /volume1/photo_video_backup:/mnt/media/backup
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - /volume2/docker/secrets/immich.env
    ports:
      - 2283:2283
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  power-tools:
    # Immich power tools for bulk operations
    container_name: immich_power_tools
    image: ghcr.io/varun-raj/immich-power-tools:latest
    ports:
      - "8001:3000"
    env_file:
      - /volume2/docker/secrets/immich.env

  immich-machine-learning:
    # Immich machine learning service for image recognition
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - /volume2/cache/immich/machine_learning:/cache
    env_file:
      - /volume2/docker/secrets/immich.env
    restart: always

  redis:
    # Redis database for immich
    container_name: immich_redis
    image: docker.io/valkey/valkey:8-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    restart: always
    healthcheck:
      test: redis-cli ping || exit 1

  database:
    # Postgres database for immich
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env_file:
      - /volume2/docker/secrets/immich.env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - /volume2/docker/immich-app/pgdata:/var/lib/postgresql/data
    restart: always
    shm_size: 128mb

  immichframe:
    # Digital photo frame for immich to display family photos on tv/monitor
    container_name: immichframe
    image: ghcr.io/immichframe/immichframe:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - /volume2/docker/secrets/immich.env
    environment:
      TZ: "Europe/Warsaw"
